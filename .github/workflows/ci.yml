name: Typover CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # `xcode-27` is macOS 26 with Xcode 27 as the default toolchain, which is
    # what swift-tools-version 6.4 needs. It is the reason Package.swift
    # compiles at .macOS(.v26): every hosted image is a macOS 26 host, and a
    # binary stamped minos 27.0 will not launch on one. The shipped bundle
    # still gates at LSMinimumSystemVersion 27.0.
    #
    # The image is marked preview upstream, so it can queue longer than GA
    # images. If it is retired, the fallback is a self-hosted macOS 27 runner.
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # Optimized builds have caught sentence-boundary regressions that the
      # debug build did not, so the roadmap treats this as a release gate.
      - name: Optimized build and test
        run: |
          swift build -c release
          swift test -c release
