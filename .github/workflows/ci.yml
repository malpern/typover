name: Typover CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Typover targets .macOS(.v27) with swift-tools-version 6.4, which needs
    # Xcode 27. GitHub-hosted macOS images top out at macOS 26, so a
    # self-hosted macOS 27 runner is the only option. Unlike KeyPath, Typover
    # has no external SwiftPM dependencies, so it does not need the
    # swiftpm-safe label that works around headless binary-artifact fetches.
    runs-on: [self-hosted, macOS, typover]
    timeout-minutes: 30

    # The suite exercises real timing behavior (deferred corrections, idle
    # gates, overlay lifecycles). Two concurrent runs on one physical machine
    # contend for CPU and reintroduce timing flakes, so serialize them.
    concurrency:
      group: typover-self-hosted-runner
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version
          sw_vers

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      # The release gate the roadmap refers to. Optimized builds have caught
      # sentence-boundary regressions that the debug build did not.
      - name: Optimized build and test
        run: |
          swift build -c release
          swift test -c release
